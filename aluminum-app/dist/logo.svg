<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64748B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#475569;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="95" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- 板材边框 (Nest) -->
  <rect x="35" y="30" width="130" height="85" rx="4" fill="none" stroke="url(#shieldGrad)" stroke-width="3"/>
  
  <!-- 嵌套零件1 -->
  <rect x="45" y="40" width="50" height="35" rx="2" fill="url(#plateGrad)"/>
  
  <!-- 嵌套零件2 -->
  <rect x="100" y="40" width="55" height="25" rx="2" fill="#94A3B8"/>
  
  <!-- 嵌套零件3 -->
  <rect x="45" y="80" width="30" height="25" rx="2" fill="#94A3B8"/>
  
  <!-- 嵌套零件4 -->
  <rect x="80" y="70" width="75" height="35" rx="2" fill="url(#plateGrad)"/>
  
  <!-- 盾牌 (Guard) -->
  <path d="M100 125 L100 175 Q100 185 90 188 Q80 190 70 182 Q55 170 55 155 L55 145 Q55 138 62 135 L100 125 L138 135 Q145 138 145 145 L145 155 Q145 170 130 182 Q120 190 110 188 Q100 185 100 175 Z" 
        fill="url(#shieldGrad)" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- 盾牌内对勾 -->
  <path d="M80 155 L95 170 L125 140" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
